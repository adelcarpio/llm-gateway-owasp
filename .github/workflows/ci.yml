name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: gitleaks revisa TODOS los commits
      - name: gitleaks (historial completo)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --log-opts="--all" --redact -v

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Suite (unitarias + seguridad antes/despues + resiliencia)
        run: python -m pytest -v
      - name: gitleaks sobre los logs generados por la suite
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --no-git --source logs/ --config .gitleaks.toml --redact -v
      - run: python scripts/report.py
      - uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/
